# Runs the database schema migrations. The backend does NOT migrate on startup,
# so this Job applies `alembic upgrade head` against the customer's PostgreSQL
# (which also seeds the default tenant + role that make the first login work).
# Alembic reads the same discrete POSTGRES_* vars (no POSTGRES_ECHO) from /agent.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asp.componentLabels" (dict "Release" .Release "component" "migrate") | nindent 4 }}
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        {{- include "asp.componentLabels" (dict "Release" .Release "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-postgres
          image: "{{ .Values.backend.image.repo }}:{{ .Values.backend.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["sh", "-c", "n=0; until python -c \"import socket; socket.create_connection(('{{ .Values.db.host }}', {{ .Values.db.port }}), 3)\"; do n=$((n+1)); [ $n -ge 60 ] && { echo \"ERROR: postgres {{ .Values.db.host }}:{{ .Values.db.port }} unreachable after 3m - check db.host/db.port and network reachability\" >&2; exit 1; }; echo \"waiting for db {{ .Values.db.host }}:{{ .Values.db.port }} ($n/60)\"; sleep 3; done"]
      containers:
        - name: migrate
          image: "{{ .Values.backend.image.repo }}:{{ .Values.backend.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          workingDir: /agent
          command: ["alembic", "upgrade", "head"]
          env:
            - name: PYTHONPATH
              value: /agent
            - name: POSTGRES_HOST
              value: {{ .Values.db.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.db.port | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.db.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.db.name | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-backend-env
                  key: POSTGRES_PASSWORD
