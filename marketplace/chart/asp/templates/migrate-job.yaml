# Runs the database schema migrations. The backend does NOT migrate on startup,
# so this Job applies `alembic upgrade head` against the customer's PostgreSQL
# (which also seeds the default tenant + role that make the first login work).
# Alembic reads the same discrete POSTGRES_* vars (no POSTGRES_ECHO) from /agent.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asp.componentLabels" (dict "Release" .Release "component" "migrate") | nindent 4 }}
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        {{- include "asp.componentLabels" (dict "Release" .Release "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-postgres
          image: "{{ .Values.backend.image.repo }}:{{ .Values.backend.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Pure python (no shell): the app image is shell-less (Chainguard).
          command: ["python", "-c", "import socket,sys,time\nh,p=('{{ .Values.db.host }}',{{ .Values.db.port }})\nfor n in range(1,61):\n try: socket.create_connection((h,p),3); break\n except OSError: print('waiting for postgres %s:%s (%d/60)'%(h,p,n),flush=True); time.sleep(3)\nelse: sys.exit('ERROR: postgres %s:%s unreachable after 3m - check db.host/db.port and network reachability'%(h,p))"]
      containers:
        - name: migrate
          image: "{{ .Values.backend.image.repo }}:{{ .Values.backend.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          workingDir: /agent
          command: ["alembic", "upgrade", "head"]
          env:
            - name: PYTHONPATH
              value: /agent
            - name: POSTGRES_HOST
              value: {{ .Values.db.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.db.port | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.db.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.db.name | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-backend-env
                  key: POSTGRES_PASSWORD
