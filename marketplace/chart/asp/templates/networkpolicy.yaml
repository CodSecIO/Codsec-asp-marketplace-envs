# Default-deny ingress to secops-mcp; only the backend may reach it on 8000.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-secops-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "asp.componentLabels" (dict "Release" .Release "component" "secops-mcp") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "asp.componentLabels" (dict "Release" .Release "component" "backend") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8000
