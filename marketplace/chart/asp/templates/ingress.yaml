# Single domain, path-routed: /api -> backend, / -> frontend. HTTPS only via a
# GKE managed certificate for the customer domain.
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: {{ .Release.Name }}-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asp.labels" . | nindent 4 }}
spec:
  domains:
    - {{ .Values.domain }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    networking.gke.io/managed-certificates: {{ .Release.Name }}-cert
    kubernetes.io/ingress.allow-http: "false"
  labels:
    {{- include "asp.labels" . | nindent 4 }}
spec:
  ingressClassName: gce
  rules:
    - host: {{ .Values.domain }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-frontend
                port:
                  number: 80
