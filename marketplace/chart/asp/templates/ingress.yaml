# Single domain, path-routed: /api -> backend, / -> frontend. HTTPS via a GKE
# managed certificate; HTTP stays enabled and is redirected to HTTPS by the
# FrontendConfig. GKE forbids allow-http:false together with managed-certificates,
# and the HTTPS redirect itself requires HTTP to remain enabled.
#
# Gated on ingress.enabled so a customer fronting ASP with their own ingress/LB can
# turn it off. It is also disabled in verification mode: with no real DNS the managed
# certificate never provisions, so the Ingress never reports ready.
{{- if .Values.ingress.enabled }}
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: {{ .Release.Name }}-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asp.labels" . | nindent 4 }}
spec:
  domains:
    - {{ .Values.domain }}
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asp.labels" . | nindent 4 }}
spec:
  redirectToHttps:
    enabled: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations:
    # GKE's ingress controller selects the class from this annotation, NOT from
    # spec.ingressClassName (which it ignores - you only get a deprecation warning).
    # With ingressClassName: gce and no `gce` IngressClass on the cluster, standard
    # Kubernetes leaves the Ingress unclaimed, so no load balancer is ever created.
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/managed-certificates: {{ .Release.Name }}-cert
    networking.gke.io/v1beta1.FrontendConfig: {{ .Release.Name | quote }}
  labels:
    {{- include "asp.labels" . | nindent 4 }}
spec:
  rules:
    - host: {{ .Values.domain }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-frontend
                port:
                  number: 80
{{- end }}
