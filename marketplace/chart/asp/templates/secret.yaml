apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-backend-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asp.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}"
  REDIS_URL: "redis://{{ .Values.redis.host }}:{{ .Values.redis.port }}/0"
  JWT_SECRET: "{{ .Values.jwtSecret }}"
