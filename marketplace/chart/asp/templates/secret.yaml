apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-backend-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asp.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Points at the bundled in-cluster Postgres/Redis Services this chart creates.
  # User/password percent-encoded for the URI userinfo (urlquery handles reserved
  # chars; replace fixes space, which urlquery renders as "+").
  DATABASE_URL: "postgresql://{{ .Values.postgres.user | urlquery | replace "+" "%20" }}:{{ .Values.dbPassword | urlquery | replace "+" "%20" }}@{{ .Release.Name }}-postgres:5432/{{ .Values.postgres.database }}"
  REDIS_URL: "redis://{{ .Release.Name }}-redis:6379/0"
  JWT_SECRET: "{{ .Values.jwtSecret }}"
  # Consumed by the bundled Postgres container (POSTGRES_PASSWORD).
  POSTGRES_PASSWORD: "{{ .Values.dbPassword }}"
