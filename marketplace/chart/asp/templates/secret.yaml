apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-backend-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asp.labels" . | nindent 4 }}
type: Opaque
stringData:
  # User and password are percent-encoded for the URI userinfo (urlquery handles
  # reserved chars; replace fixes space, which urlquery renders as "+").
  DATABASE_URL: "postgresql://{{ .Values.postgres.user | urlquery | replace "+" "%20" }}:{{ .Values.postgres.password | urlquery | replace "+" "%20" }}@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}"
  {{- if .Values.redis.password }}
  REDIS_URL: "redis://:{{ .Values.redis.password | urlquery | replace "+" "%20" }}@{{ .Values.redis.host }}:{{ .Values.redis.port }}/0"
  {{- else }}
  REDIS_URL: "redis://{{ .Values.redis.host }}:{{ .Values.redis.port }}/0"
  {{- end }}
  JWT_SECRET: "{{ .Values.jwtSecret }}"
