apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-backend-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asp.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The backend reads discrete POSTGRES_*/REDIS_* vars (not a DATABASE_URL). The
  # non-secret host/port/db/user are set as plain env on the workloads; only the
  # secret values live here. base64 is handled once by the API server (stringData).
  POSTGRES_PASSWORD: {{ .Values.db.password | quote }}
  {{- if .Values.redis.password }}
  REDIS_PASSWORD: {{ .Values.redis.password | quote }}
  {{- end }}
  JWT_SECRET: {{ .Values.jwtSecret | quote }}
  # Admin api-key: authenticates the bootstrap Job to create the first user.
  API_KEY: {{ .Values.apiKey | quote }}
  # Initial admin password (also used by the bootstrap Job).
  ADMIN_PASSWORD: {{ .Values.adminPassword | quote }}
  {{- if .Values.googleApiKey }}
  # LLM provider key (default agent provider is Google GenAI); chat fails without it.
  GOOGLE_API_KEY: {{ .Values.googleApiKey | quote }}
  {{- end }}
