apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-backend-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asp.labels" . | nindent 4 }}
type: Opaque
stringData:
  # User/password percent-encoded for the URI userinfo (urlquery handles reserved
  # chars; replace fixes space, which urlquery renders as "+").
  {{- if .Values.postgres.bundled }}
  # Bundled mode: points at the in-cluster Postgres Service this chart creates.
  DATABASE_URL: "postgresql://{{ .Values.postgres.user | urlquery | replace "+" "%20" }}:{{ .Values.dbPassword | urlquery | replace "+" "%20" }}@{{ .Release.Name }}-postgres:5432/{{ .Values.postgres.database }}"
  # Consumed by the bundled Postgres container (POSTGRES_PASSWORD).
  POSTGRES_PASSWORD: "{{ .Values.dbPassword }}"
  {{- else }}
  # External mode: managed Postgres (Cloud SQL) provisioned by the Terraform
  # Marketplace module, which injects host/port/password as Helm values.
  DATABASE_URL: "postgresql://{{ .Values.postgres.user | urlquery | replace "+" "%20" }}:{{ .Values.postgres.password | urlquery | replace "+" "%20" }}@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}"
  {{- end }}
  REDIS_URL: "redis://{{ .Release.Name }}-redis:6379/0"
  JWT_SECRET: "{{ .Values.jwtSecret }}"
