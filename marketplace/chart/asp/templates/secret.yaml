apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-backend-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asp.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Postgres is managed Cloud SQL (provisioned by the Terraform module); its
  # connection values are injected as Helm values at deploy time. Redis is the
  # in-cluster Service this chart creates. User/password percent-encoded for the
  # URI userinfo (urlquery handles reserved chars; replace fixes space -> "%20").
  DATABASE_URL: "postgresql://{{ .Values.postgres.user | urlquery | replace "+" "%20" }}:{{ .Values.postgres.password | urlquery | replace "+" "%20" }}@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}"
  REDIS_URL: "redis://{{ .Release.Name }}-redis:6379/0"
  JWT_SECRET: "{{ .Values.jwtSecret }}"
