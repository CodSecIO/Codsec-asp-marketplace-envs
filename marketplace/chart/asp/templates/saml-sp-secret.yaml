apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-saml-sp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asp.labels" . | nindent 4 }}
type: Opaque
# base64EncodedCertificate is base64(PEM); Secret.data is base64, so the app env
# receives the PEM after the API server decodes once. NO lookup (empty at render, C8).
data:
  SAML_SP_X509CERT: {{ .Values.samlSpCertificateB64 | quote }}
  SAML_SP_PRIVATEKEY: {{ .Values.samlSpPrivatekeyB64 | quote }}
