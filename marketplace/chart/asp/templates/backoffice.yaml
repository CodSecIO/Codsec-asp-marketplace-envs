apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backoffice
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asp.componentLabels" (dict "Release" .Release "component" "backoffice") | nindent 4 }}
spec:
  replicas: {{ .Values.backoffice.replicas }}
  selector:
    matchLabels:
      {{- include "asp.componentLabels" (dict "Release" .Release "component" "backoffice") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "asp.componentLabels" (dict "Release" .Release "component" "backoffice") | nindent 8 }}
        goog-partner-solution: {{ .Values.partnerSolutionId }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backoffice
          image: "{{ .Values.backoffice.image.repo }}:{{ .Values.backoffice.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Next.js writes its .next cache
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NODE_ENV
              value: "production"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            # Public backend URL the browser calls; backend is served at /api on the chat domain.
            - name: SERVER_HOST
              value: "https://{{ .Values.domain }}"
          readinessProbe:
            httpGet:
              path: /auth/login
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backoffice
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asp.componentLabels" (dict "Release" .Release "component" "backoffice") | nindent 4 }}
spec:
  selector:
    {{- include "asp.componentLabels" (dict "Release" .Release "component" "backoffice") | nindent 4 }}
  ports:
    - port: 80
      targetPort: 3000
