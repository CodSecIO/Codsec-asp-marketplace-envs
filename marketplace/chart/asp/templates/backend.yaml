apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asp.componentLabels" (dict "Release" .Release "component" "backend") | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "asp.componentLabels" (dict "Release" .Release "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "asp.componentLabels" (dict "Release" .Release "component" "backend") | nindent 8 }}
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Backend lifespan does a DB connection check at startup and aborts if
        # Postgres isn't reachable, so wait for it first. Uses the backend image
        # (which has python) for a TCP probe - no separate DB image to pull.
        - name: wait-postgres
          image: "{{ .Values.backend.image.repo }}:{{ .Values.backend.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Let the socket error print (no 2>/dev/null) and give up after ~3m with a
          # clear message, so a wrong/unreachable db.host fails visibly instead of
          # hanging Init:0/1 forever.
          # Pure python (no shell): the app image is shell-less (Chainguard).
          command: ["python", "-c", "import socket,sys,time\nh,p=('{{ .Values.db.host }}',{{ .Values.db.port }})\nfor n in range(1,61):\n try: socket.create_connection((h,p),3); break\n except OSError: print('waiting for postgres %s:%s (%d/60)'%(h,p,n),flush=True); time.sleep(3)\nelse: sys.exit('ERROR: postgres %s:%s unreachable after 3m - check db.host/db.port and network reachability'%(h,p))"]
        # Redis holds agent checkpoints. The checkpointer is created on first use and
        # permanently falls back to an in-memory store if Redis is unreachable then, so
        # make the bundled Redis reachable before the backend starts serving.
        - name: wait-redis
          image: "{{ .Values.backend.image.repo }}:{{ .Values.backend.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["python", "-c", "import socket,sys,time\nh,p=('{{ .Release.Name }}-redis',6379)\nfor n in range(1,61):\n try: socket.create_connection((h,p),3); break\n except OSError: print('waiting for redis %s:%s (%d/60)'%(h,p,n),flush=True); time.sleep(3)\nelse: sys.exit('ERROR: redis %s:%s unreachable after 3m'%(h,p))"]
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repo }}:{{ .Values.backend.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
          # The app reads discrete env (NOT a DATABASE_URL/REDIS_URL). Secrets come
          # from explicit keyRefs so ADMIN_PASSWORD (only the bootstrap Job needs it)
          # is never pulled into the backend's environment.
          env:
            - name: API_PORT
              value: "8000"
            - name: MCP_ENVIRONMENT_TYPE
              value: "prod"
            - name: POSTGRES_HOST
              value: {{ .Values.db.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.db.port | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.db.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.db.name | quote }}
            - name: POSTGRES_ECHO
              value: "false"
            # Bundled in-cluster Redis (no auth, no TLS).
            - name: REDIS_HOST
              value: {{ .Release.Name }}-redis
            - name: REDIS_PORT
              value: "6379"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-backend-env
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-backend-env
                  key: JWT_SECRET
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-backend-env
                  key: API_KEY
            {{- if .Values.googleApiKey }}
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-backend-env
                  key: GOOGLE_API_KEY
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asp.componentLabels" (dict "Release" .Release "component" "backend") | nindent 4 }}
spec:
  selector:
    {{- include "asp.componentLabels" (dict "Release" .Release "component" "backend") | nindent 4 }}
  ports:
    - port: 80
      targetPort: 8000
