apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asp.componentLabels" (dict "Release" .Release "component" "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "asp.componentLabels" (dict "Release" .Release "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "asp.componentLabels" (dict "Release" .Release "component" "frontend") | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repo }}:{{ .Values.frontend.image.tag }}"
          ports:
            - name: http
              containerPort: 3000
          # The chat UI reads its backend host at runtime from SERVER_HOST (via
          # its /runtime/app-configs route), so one prebuilt image works on any
          # domain. Single-domain deploy: the backend is /api on the same host.
          env:
            - name: SERVER_HOST
              value: "https://{{ .Values.domain }}"
            # TODO: the app-configs route also reads APP_NAMES, DEFAULT_APP_NAME,
            # DEFAULT_AGENT, LOGO_URL, etc. Wire these (schema inputs) before submit.
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asp.componentLabels" (dict "Release" .Release "component" "frontend") | nindent 4 }}
spec:
  selector:
    {{- include "asp.componentLabels" (dict "Release" .Release "component" "frontend") | nindent 4 }}
  ports:
    - port: 80
      targetPort: 3000
