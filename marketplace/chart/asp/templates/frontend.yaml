apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asp.componentLabels" (dict "Release" .Release "component" "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "asp.componentLabels" (dict "Release" .Release "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "asp.componentLabels" (dict "Release" .Release "component" "frontend") | nindent 8 }}
        goog-partner-solution: {{ .Values.partnerSolutionId }}
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repo }}:{{ .Values.frontend.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3000
          # The chat UI reads its backend host at runtime from SERVER_HOST (via
          # its /runtime/app-configs route), so one prebuilt image works on any
          # domain. Single-domain deploy: the backend is /api on the same host.
          env:
            - name: SERVER_HOST
              value: "https://{{ .Values.domain }}"
          # Probe /chat, not /: Next.js 308-redirects / -> /chat, and the GKE
          # ingress (GCLB) health check only treats 2xx as healthy. kubelet accepts
          # 3xx so / would pass this probe, but the load balancer would still mark
          # the pod UNHEALTHY and serve 502. /chat returns 200. Timeout/failures are
          # generous because Next.js SSR can be slow on a cold start.
          readinessProbe:
            httpGet:
              path: /chat
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "asp.componentLabels" (dict "Release" .Release "component" "frontend") | nindent 4 }}
spec:
  selector:
    {{- include "asp.componentLabels" (dict "Release" .Release "component" "frontend") | nindent 4 }}
  ports:
    - port: 80
      targetPort: 3000
