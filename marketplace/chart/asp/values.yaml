# Defaults render the chart standalone (helm template). Google Cloud Marketplace
# overrides the image repo/tag fields and injects name/namespace + the inputs
# declared in schema.yaml at deploy time. The image tags below are placeholders
# for local render only; Marketplace substitutes the real published repo/tag
# (track 1.4 / version 1.4.0) at deploy time.

publishedVersion: "1.4.0"

# Public domain for the chat UI; the backend is served at /api on the same host.
domain: asp.example.com

# Public domain for the admin backoffice. Only consumed when ingress.enabled; blank = backoffice not externally exposed.
backofficeDomain: ""

# Bundled GKE Ingress + managed TLS certificate. OFF by default (private-by-default,
# matching the Cloud Marketplace click-to-deploy convention): ASP is a ClusterIP
# Service reached via `kubectl port-forward` or your own ingress/LB. Set true to opt
# into the bundled external Ingress - that adds a 15-60 min managed-cert wait and
# requires pointing the domain's DNS at the load balancer IP after install.
ingress:
  enabled: false

frontend:
  image:
    # Additional image: lives under the primary image's app root.
    repo: us-docker.pkg.dev/codsec-public/asp-deployer/asp/frontend
    tag: "1.4.0"
  replicas: 2

backend:
  image:
    # Primary image (schema empty key ""): sits AT the app root; the deployer
    # lives at <root>/deployer and additional images at <root>/<name>.
    repo: us-docker.pkg.dev/codsec-public/asp-deployer/asp
    tag: "1.4.0"
  replicas: 2

backoffice:
  image:
    # Additional image: the master-admin console (Next.js). Republished + CVE-scanned by Marketplace.
    repo: us-docker.pkg.dev/codsec-public/asp-deployer/asp/backoffice
    tag: "1.4.0"
  replicas: 1

# Bring-your-own managed PostgreSQL 16. Marketplace injects these from the
# schema inputs; the placeholders below only let the chart render standalone.
# The backend connects without TLS, so the database must accept non-TLS connections.
db:
  host: ""
  port: 5432
  user: asp
  name: asp
  password: ""

# Bundled in-cluster Redis 8 (ships RedisJSON + RediSearch, which the backend
# requires). Not bring-your-own - no managed external Redis provides those modules.
# Sized for large tenants; tune resources / persistence.size for your load.
redis:
  image:
    # Additional image, republished + CVE-scanned by Marketplace (declared in schema).
    repo: us-docker.pkg.dev/codsec-public/asp-deployer/asp/redis
    tag: "1.4.0"
  # Cap memory below the container limit so Redis never OOMKills; volatile-lru evicts
  # only expiring (TTL'd) checkpoint keys under pressure, never index metadata.
  maxmemory: "6gb"
  maxmemoryPolicy: volatile-lru
  persistence:
    size: 50Gi
    storageClass: ""
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 8Gi

# Generated at deploy time by Marketplace (schema GENERATED_PASSWORD); set here
# only so the chart renders standalone.
jwtSecret: ""
apiKey: ""
# Gates the one-time SAML-config bootstrap that provisions the first admin (SSO).
bootstrapApiKey: ""

# Optional LLM provider key so the chat agent works (default provider is Google
# GenAI). Without it the app installs and you can log in, but sending a chat fails.
googleApiKey: ""

# SAML SP keypair. Generated by Marketplace (TLS_CERTIFICATE) at deploy time;
# these blanks only let the chart render standalone. Persisted across upgrades
# by the saml-sp-secret template (lookup-guarded) so IdP-registered SP metadata
# stays valid.
spCertificate:
  base64EncodedCertificate: ""
  base64EncodedPrivateKey: ""
