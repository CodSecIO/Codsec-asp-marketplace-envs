# Verification overlay for `mpdev verify`. Supplies defaults for the required app
# properties that have no default in the main schema.yaml, so the app can be
# installed headlessly during verification. Production installs still require the
# user to enter these. GENERATED_PASSWORD properties (adminPassword/apiKey/
# jwtSecret) are auto-filled by the verifier, so they need no default.
properties:
  domain:
    type: string
    default: asp.example.com
  adminEmail:
    type: string
    default: admin@example.com
  # No real DNS in verification, so the managed cert never provisions and the
  # Ingress never reports ready - skip it so wait_for_ready can converge.
  ingress.enabled:
    type: boolean
    default: false
  # Point the BYO Postgres inputs at the ephemeral verify-db fixture
  # (apptest/deployer/asp/templates). db.user/db.name/db.port use their main-schema
  # defaults (asp/asp/5432), which match the fixture's credentials. Redis is bundled
  # by the main chart, so verification exercises the real bundled Redis 8.
  db.host:
    type: string
    default: asp-verify-db
  db.password:
    type: string
    default: verifypass
    # Must repeat the main schema's x-google-marketplace block unchanged -
    # overlay_test_schema rejects dropping/changing the type (it replaces the
    # whole property, so the default rides alongside the same MASKED_FIELD type).
    x-google-marketplace:
      type: MASKED_FIELD
