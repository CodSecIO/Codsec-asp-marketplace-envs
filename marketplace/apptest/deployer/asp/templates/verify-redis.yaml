# Verify-only ephemeral Redis (see verify-db.yaml). Docker Hub image, no auth/TLS;
# the apptest overlay sets redis.host to this fixed Service name. Not a product image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asp-verify-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: asp-verify-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asp-verify-redis
  template:
    metadata:
      labels:
        app: asp-verify-redis
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: asp-verify-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: asp-verify-redis
spec:
  selector:
    app: asp-verify-redis
  ports:
    - port: 6379
      targetPort: 6379
