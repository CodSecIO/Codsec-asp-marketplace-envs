x-google-marketplace:
  schemaVersion: v2
  applicationApiVersion: v1beta1
  # Full semver of this release; rendered into the Application CRD version.
  # Distinct from the rolling image track tag (e.g. 1.1).
  publishedVersion: "1.1.0"
  publishedVersionMetadata:
    releaseNote: >-
      CodSec ASP: chat UI and backend API. Bring your own managed PostgreSQL 16
      and Redis - their connection details are deploy-time inputs (the package no
      longer bundles in-cluster data services).

  images:
    # Main image: backend (secops-agent). Empty key is the primary image.
    '':
      properties:
        backend.image.repo:
          type: REPO_WITH_REGISTRY
        backend.image.tag:
          type: TAG
    frontend:
      properties:
        frontend.image.repo:
          type: REPO_WITH_REGISTRY
        frontend.image.tag:
          type: TAG

  # Namespaced Role scoped to exactly what the deployer creates.
  deployerServiceAccount:
    description: >-
      Creates and manages the ASP application resources in the install namespace:
      Deployments, Services, Secrets, a ConfigMap, the schema-migration and
      bootstrap Jobs, an Ingress with a GKE ManagedCertificate and FrontendConfig,
      and the Application custom resource.
    roles:
      - type: Role
        rulesType: CUSTOM
        rules:
          - apiGroups: ["apps"]
            resources: ["deployments"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          - apiGroups: ["batch"]
            resources: ["jobs"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          # pods + pods/log are required so the deployer SA can apply and watch
          # the apptest tester Pod during `mpdev verify`.
          # serviceaccounts: the deployer's post-test cleanup deletes its own SA by label.
          - apiGroups: [""]
            resources: ["services", "secrets", "configmaps", "serviceaccounts", "pods"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          - apiGroups: [""]
            resources: ["pods/log"]
            verbs: ["get"]
          # The deployer reads its target namespace during setup.
          - apiGroups: [""]
            resources: ["namespaces"]
            verbs: ["get"]
          - apiGroups: ["networking.k8s.io"]
            resources: ["ingresses"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          - apiGroups: ["networking.gke.io"]
            resources: ["managedcertificates", "frontendconfigs"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          - apiGroups: ["app.k8s.io"]
            resources: ["applications"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

properties:
  name:
    type: string
    x-google-marketplace:
      type: NAME
  namespace:
    type: string
    x-google-marketplace:
      type: NAMESPACE

  domain:
    type: string
    title: Public domain for the chat UI (e.g. asp.example.com)

  # Bring-your-own data services. ASP connects to a managed PostgreSQL 16 and a
  # Redis that you provision and reach from the cluster - the package does not run
  # them in-cluster. The backend connects to Postgres without TLS, so the database
  # must accept non-TLS connections (e.g. Cloud SQL over private IP).
  db.host:
    type: string
    title: PostgreSQL host (hostname or IP reachable from the cluster)
  db.port:
    type: integer
    title: PostgreSQL port
    default: 5432
    minimum: 1
    maximum: 65535
  db.user:
    type: string
    title: PostgreSQL user
    default: asp
  db.name:
    type: string
    title: PostgreSQL database name
    default: asp
  db.password:
    type: string
    title: PostgreSQL password
    x-google-marketplace:
      type: MASKED_FIELD

  redis.host:
    type: string
    title: Redis host (hostname or IP reachable from the cluster)
  redis.port:
    type: integer
    title: Redis port
    default: 6379
    minimum: 1
    maximum: 65535
  redis.password:
    type: string
    title: Redis password (optional; leave blank if Redis has no auth)
    x-google-marketplace:
      type: MASKED_FIELD
  redis.tls:
    type: boolean
    title: Connect to Redis over TLS
    default: false

  adminEmail:
    type: string
    title: Initial admin email (used to log in after install)

  adminPassword:
    type: string
    title: Initial admin password (generated if left blank)
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        # Symbols included so it satisfies the backend password policy
        # (>=12 chars, upper + lower + digit + special).
        length: 16
        includeSymbols: true
        base64: false

  googleApiKey:
    type: string
    title: Google API key for the chat agent (optional; chat is disabled without it)

  ingress.enabled:
    type: boolean
    default: true
    title: Create a GKE Ingress with a managed TLS certificate (uncheck to use your own)

  apiKey:
    type: string
    title: Backend admin API key (generated; used to bootstrap the first user)
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        length: 32
        includeSymbols: false
        base64: false

  jwtSecret:
    type: string
    title: JWT signing secret (generated if left blank)
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        # false: the raw value flows into the Secret stringData (which the API
        # server base64-encodes once). base64:true would double-encode here.
        length: 48
        includeSymbols: false
        base64: false

required:
  - name
  - namespace
  - domain
  - db.host
  - db.password
  - redis.host
  - adminEmail
