x-google-marketplace:
  schemaVersion: v2
  applicationApiVersion: v1beta1
  # Full semver of this release; rendered into the Application CRD version.
  # Distinct from the rolling image track tag (e.g. 1.0).
  publishedVersion: "1.0.0"
  publishedVersionMetadata:
    releaseNote: >-
      Initial Marketplace release of CodSec ASP: chat UI and backend API, with
      bundled in-cluster PostgreSQL and Redis (demo-grade; contact CodSec for
      production-managed data services).

  images:
    # Main image: backend (secops-agent). Empty key is the primary image.
    '':
      properties:
        backend.image.repo:
          type: REPO_WITH_REGISTRY
        backend.image.tag:
          type: TAG
    frontend:
      properties:
        frontend.image.repo:
          type: REPO_WITH_REGISTRY
        frontend.image.tag:
          type: TAG

  # Namespaced Role scoped to exactly what the deployer creates.
  deployerServiceAccount:
    roles:
      - type: Role
        rulesType: CUSTOM
        rules:
          - apiGroups: ["apps"]
            resources: ["deployments"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          # pods + pods/log are required so the deployer SA can apply and watch
          # the apptest tester Pod during `mpdev verify`.
          - apiGroups: [""]
            resources: ["services", "secrets", "pods", "persistentvolumeclaims"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          - apiGroups: [""]
            resources: ["pods/log"]
            verbs: ["get"]
          - apiGroups: ["networking.k8s.io"]
            resources: ["ingresses", "networkpolicies"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          - apiGroups: ["networking.gke.io"]
            resources: ["managedcertificates", "frontendconfigs"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          - apiGroups: ["app.k8s.io"]
            resources: ["applications"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

properties:
  name:
    type: string
    x-google-marketplace:
      type: NAME
  namespace:
    type: string
    x-google-marketplace:
      type: NAMESPACE

  domain:
    type: string
    title: Public domain for the chat UI (e.g. asp.example.com)

  # Postgres + Redis are bundled in-cluster, so there are no connection inputs.
  # Only the DB password is generated; everything else has chart defaults.
  dbPassword:
    type: string
    title: Bundled PostgreSQL password (generated if left blank)
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        length: 32
        includeSymbols: false
        base64: false

  jwtSecret:
    type: string
    title: JWT signing secret (generated if left blank)
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        length: 48
        includeSymbols: false
        # false: the raw value flows into the Secret stringData (which the API
        # server base64-encodes once). base64:true would double-encode here.
        base64: false

required:
  - name
  - namespace
  - domain
