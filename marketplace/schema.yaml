x-google-marketplace:
  schemaVersion: v2
  applicationApiVersion: v1beta1
  # Full semver of this release; rendered into the Application CRD version.
  # Distinct from the rolling image track tag (e.g. 1.4).
  publishedVersion: "1.6.1"
  publishedVersionMetadata:
    releaseNote: >-
      CodSec ASP: chat UI and backend API. Bring your own managed PostgreSQL 16;
      Redis 8 (RedisJSON + RediSearch, required by the agent) is bundled
      in-cluster. The public ingress is opt-in - ASP is a ClusterIP Service by
      default; enable the bundled GKE Ingress + managed certificate with
      ingress.enabled. The first admin signs in via SAML SSO: after install, seed
      the master-tenant SAML config through POST /api/settings/bootstrap using the
      generated bootstrapApiKey, then log in through your IdP (see docs/install.md).

  images:
    # Main image: backend (secops-agent). Empty key is the primary image.
    '':
      properties:
        backend.image.repo:
          type: REPO_WITH_REGISTRY
        backend.image.tag:
          type: TAG
    frontend:
      properties:
        frontend.image.repo:
          type: REPO_WITH_REGISTRY
        frontend.image.tag:
          type: TAG
    # Bundled in-cluster Redis 8 - republished + CVE-scanned like any deployed image.
    redis:
      properties:
        redis.image.repo:
          type: REPO_WITH_REGISTRY
        redis.image.tag:
          type: TAG
    backoffice:
      properties:
        backoffice.image.repo:
          type: REPO_WITH_REGISTRY
        backoffice.image.tag:
          type: TAG

  # Namespaced Role scoped to exactly what the deployer creates.
  deployerServiceAccount:
    description: >-
      Creates and manages the ASP application resources in the install namespace:
      Deployments, Services, Secrets, ConfigMaps, a PersistentVolumeClaim for the
      bundled Redis, the schema-migration Job, an optional Ingress with a GKE
      ManagedCertificate and FrontendConfig, and the Application resource.
    roles:
      - type: Role
        rulesType: CUSTOM
        rules:
          - apiGroups: ["apps"]
            resources: ["deployments"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          - apiGroups: ["batch"]
            resources: ["jobs"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          # pods + pods/log are required so the deployer SA can apply and watch
          # the apptest tester Pod during `mpdev verify`.
          # serviceaccounts: the deployer's post-test cleanup deletes its own SA by label.
          - apiGroups: [""]
            resources: ["services", "secrets", "configmaps", "serviceaccounts", "pods", "persistentvolumeclaims"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          - apiGroups: [""]
            resources: ["pods/log"]
            verbs: ["get"]
          # The deployer reads its target namespace during setup.
          - apiGroups: [""]
            resources: ["namespaces"]
            verbs: ["get"]
          - apiGroups: ["networking.k8s.io"]
            resources: ["ingresses"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          - apiGroups: ["networking.gke.io"]
            resources: ["managedcertificates", "frontendconfigs"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          - apiGroups: ["app.k8s.io"]
            resources: ["applications"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

properties:
  name:
    type: string
    x-google-marketplace:
      type: NAME
  namespace:
    type: string
    x-google-marketplace:
      type: NAMESPACE

  domain:
    type: string
    title: Public domain for the chat UI (e.g. asp.example.com)

  backofficeDomain:
    type: string
    title: Public domain for the admin backoffice (only used with the bundled ingress; e.g. admin.example.com)

  # Bring-your-own PostgreSQL 16 (Redis is bundled in-cluster). ASP connects to a
  # managed Postgres you provision and reach from the cluster; it connects without
  # TLS, so the database must accept non-TLS connections (e.g. Cloud SQL private IP).
  db.host:
    type: string
    title: PostgreSQL host (hostname or IP reachable from the cluster)
  db.port:
    type: integer
    title: PostgreSQL port
    default: 5432
    minimum: 1
    maximum: 65535
  db.user:
    type: string
    title: PostgreSQL user
    default: asp
  db.name:
    type: string
    title: PostgreSQL database name
    default: asp
  db.password:
    type: string
    title: PostgreSQL password
    x-google-marketplace:
      type: MASKED_FIELD

  # v0.12 has no local email/password admin - the first MASTER_TENANT_ADMIN is
  # provisioned by the first SAML SSO login. This key gates the one-time call that
  # seeds the master-tenant SAML config (POST /api/settings/bootstrap).
  bootstrapApiKey:
    type: string
    title: First-admin bootstrap key (generated; gates the one-time SAML setup call)
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        length: 32
        includeSymbols: false
        base64: false

  googleApiKey:
    type: string
    title: Google API key for the chat agent (optional; chat is disabled without it)

  ingress.enabled:
    type: boolean
    default: false
    title: Create a bundled GKE Ingress with a managed TLS certificate (off by default - leave off to expose ASP with your own ingress/LB; enabling it adds a 15-60 min cert wait and needs DNS pointed at the load balancer)

  apiKey:
    type: string
    title: Backend admin API key (generated; legacy, honoured only in dev)
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        length: 32
        includeSymbols: false
        base64: false

  jwtSecret:
    type: string
    title: JWT signing secret (generated if left blank)
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        # false: the raw value flows into the Secret stringData (which the API
        # server base64-encodes once). base64:true would double-encode here.
        length: 48
        includeSymbols: false
        base64: false

  spCertificate:
    type: string
    x-google-marketplace:
      type: TLS_CERTIFICATE
      tlsCertificate:
        generatedProperties:
          base64EncodedPrivateKey: samlSpPrivatekeyB64
          base64EncodedCertificate: samlSpCertificateB64

  saml.idpEntityId:
    type: string
    title: SAML IdP entity ID (optional; enables first-admin SSO auto-setup)
  saml.idpSsoUrl:
    type: string
    title: SAML IdP single sign-on URL (optional)
  saml.idpX509Cert:
    type: string
    title: SAML IdP X.509 signing certificate (optional; public cert, plain string) [F-D]
  saml.attrEmail:
    type: string
    title: IdP attribute name carrying the user email
    default: email
  saml.attrFirstName:
    type: string
    title: IdP attribute name carrying the first name
    default: first-name
  saml.attrLastName:
    type: string
    title: IdP attribute name carrying the last name
    default: last-name

required:
  - name
  - namespace
  - domain
  - db.host
  - db.password
