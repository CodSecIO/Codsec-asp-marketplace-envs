apiVersion: v1
kind: Service
metadata:
  name: {{ include "asp-frontend.name" . }}
  labels: {{- include "asp-frontend.labels" . | nindent 4 }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: {{ include "asp-frontend.name" . }}
