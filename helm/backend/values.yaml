replicaCount: 2

image:
  repository: REPLACE_ME/asp-backend
  tag: REPLACE_ME
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  port: 80
  targetPort: 8000

# Kubernetes Secret (created out-of-band) holding backend env vars:
#   DATABASE_URL, REDIS_URL, JWT_SECRET, ...
envFromSecret: asp-backend-env

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

ingress:
  enabled: true
  className: gce
  host: api.asp.example.com
  staticIpName: ""        # optional; set to terraform output gateway_ip name
  managedCertificate: true

probes:
  path: /healthz
