apiVersion: blueprints.cloud.google.com/v1alpha1
kind: BlueprintMetadata
metadata:
  name: Codsec-asp-marketplace-envs
  annotations:
    config.kubernetes.io/local-config: "true"
spec:
  info:
    title: ASP - Google Cloud Marketplace Terraform Kubernetes app
    source:
      repo: https://github.com/CodSecIO/Codsec-asp-marketplace-envs.git
      sourceType: git
      dir: /terraform-marketplace
    actuationTool:
      flavor: Terraform
      version: ">= 1.5.7"
    description: {}
  content:
    subBlueprints:
      - name: cloudsql-postgres
        location: modules/cloudsql-postgres
      - name: gke
        location: modules/gke
      - name: vpc
        location: modules/vpc
  interfaces:
    variables:
      - name: project_id
        description: GCP project id
        varType: string
        required: true
      - name: helm_chart_repo
        description: Helm chart repository (injected by Marketplace)
        varType: string
        defaultValue: oci://us-docker.pkg.dev/codsec-public/asp-charts
      - name: helm_chart_name
        description: Helm chart name (injected by Marketplace)
        varType: string
        defaultValue: asp
      - name: helm_chart_version
        description: Helm chart version (injected by Marketplace)
        varType: string
        defaultValue: 1.0.0
      - name: backend_image_repo
        description: Backend (primary) image repository, without tag
        varType: string
        defaultValue: us-docker.pkg.dev/codsec-public/asp-charts/backend
      - name: backend_image_tag
        description: Backend image tag
        varType: string
        defaultValue: "1.0"
      - name: frontend_image_repo
        description: Frontend image repository, without tag
        varType: string
        defaultValue: us-docker.pkg.dev/codsec-public/asp-charts/frontend
      - name: frontend_image_tag
        description: Frontend image tag
        varType: string
        defaultValue: "1.0"
      - name: domain
        description: Public domain for the chat UI (e.g. asp.example.com). Point its DNS at the ingress IP after deploy.
        varType: string
        defaultValue: asp.example.com
      - name: goog_cm_deployment_name
        description: Deployment name; prefix applied to created resource names
        varType: string
        defaultValue: asp
      - name: environment
        description: Environment label used in created resource names
        varType: string
        defaultValue: prod
      - name: namespace
        description: Kubernetes namespace for the app (defaults to the deployment name)
        varType: string
        defaultValue: ""
      - name: helm_release_name
        description: Helm release name (defaults to asp)
        varType: string
        defaultValue: ""
      - name: region
        description: GCP region for all created resources
        varType: string
        defaultValue: us-central1
      - name: create_cluster
        description: Create a dedicated GKE cluster. When false (default), ASP deploys onto the existing cluster named in cluster_name.
        varType: bool
        defaultValue: false
      - name: cluster_name
        description: Existing cluster name (required when create_cluster = false). When create_cluster = true and this is empty, the name is derived as <deployment-name>-<environment>-gke.
        varType: string
        defaultValue: ""
      - name: cluster_location
        description: Location (region or zone) of the existing cluster. Defaults to region.
        varType: string
        defaultValue: ""
      - name: kubernetes_version
        description: Kubernetes version for a created cluster
        varType: string
        defaultValue: "1.33"
      - name: regional
        description: Create a regional (true) or zonal (false) cluster
        varType: bool
        defaultValue: false
      - name: zone
        description: Zone for a zonal created cluster (e.g. us-central1-a). Empty picks the first available zone in the region.
        varType: string
        defaultValue: ""
      - name: node_machine_type
        description: Machine type for the created cluster's node pool
        varType: string
        defaultValue: e2-standard-4
      - name: node_min_count
        description: Node pool autoscaling minimum
        varType: number
        defaultValue: 1
      - name: node_max_count
        description: Node pool autoscaling maximum
        varType: number
        defaultValue: 5
      - name: create_network
        description: Create a dedicated VPC (with subnet, GKE secondary ranges, and Private Services Access). When false (default), the existing network below is used and it MUST already have a Private Services Access connection for Cloud SQL private IP.
        varType: bool
        defaultValue: false
      - name: network_name
        description: Existing VPC name (used when create_network = false)
        varType: string
        defaultValue: default
      - name: subnetwork_name
        description: Existing subnetwork name (used when create_network = false)
        varType: string
        defaultValue: default
      - name: network_cidr
        description: Base CIDR for a created VPC
        varType: string
        defaultValue: 10.2.0.0/16
      - name: ip_range_pods
        description: Name of the pods secondary range when creating a cluster in an existing network
        varType: string
        defaultValue: ""
      - name: ip_range_services
        description: Name of the services secondary range when creating a cluster in an existing network
        varType: string
        defaultValue: ""
      - name: db_tier
        description: Cloud SQL machine tier
        varType: string
        defaultValue: db-custom-1-3840
      - name: db_availability_type
        description: Cloud SQL availability type (ZONAL or REGIONAL)
        varType: string
        defaultValue: ZONAL
      - name: db_disk_size
        description: Cloud SQL disk size in GB (autoresizes up to 5x)
        varType: number
        defaultValue: 20
      - name: db_name
        description: Application database name
        varType: string
        defaultValue: asp
      - name: db_user
        description: Application database user
        varType: string
        defaultValue: asp
      - name: db_deletion_protection
        description: Protect the Cloud SQL instance from deletion. Keep true in production; deleting the deployment with this enabled requires disabling it first.
        varType: bool
        defaultValue: true
    outputs:
      - name: cluster_location
        description: GKE cluster location
      - name: cluster_name
        description: GKE cluster running ASP
      - name: domain
        description: "Configured public domain for the chat UI. After deploy, point its DNS A record at the Ingress IP shown by: kubectl get ingress -n <namespace>"
      - name: namespace
        description: Kubernetes namespace ASP is installed in
      - name: network_name
        description: VPC network used by the deployment
      - name: project_id
        description: GCP project ID
      - name: sql_instance
        description: Cloud SQL instance name (managed PostgreSQL)
      - name: sql_private_ip
        description: Private IP the app uses to reach Cloud SQL
